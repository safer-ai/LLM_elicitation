# =============================================================================
# Experiment I — prompt ablation (Brier), condition: TRIM_ALL  (Level 1)
# Forecaster model: claude-sonnet-4-6, reasoning_effort=off (no thinking)
#
# Cumulative scaffold removal: drops BOTH scaffold pieces at once —
#   - the stage-1 analysis CALL (skip_analysis: true)
#   - the <your_prior_analysis> block (no analysis to inject)
#   - the reasoning checklist + <reasoning> output block
# while KEEPING everything that is not "scaffold":
#   - the capability_profile evidence (bin pass rates + per-task outcomes)
#   - the {ground_truth_summary} footnote (held constant vs control)
#   - the benchmark context + estimation framing + percentile/rationale output
#
# This is the staircase point between skip_analysis/trim_reasoning and minimal:
# it should ~recover the full control→minimal gap, attributable jointly to the
# two scaffold pieces. (minimal additionally strips footnote + framing.)
#
# Cell count:  5 target bins × 12 forecasted models × 5 tasks = 300 cells
# API calls:   300 × 1 (estimation only) × 1 repeat              = 300
# =============================================================================

intra_benchmark_settings:
  lyptus_repo_dir: ~/lyptus-data
  drop_models: ["GPT-2", "GPT-3", "GPT-3.5"]
  forecasted_models: null   # null → all 12 models post-drop

  binning:
    n_bins: 5
    strategy: equal_count

  target_selection:
    selection_mode: "auto"
    n_target_tasks_per_cell: 5

  source_profile:
    source_bins_to_show: "all_except_target"
    n_examples_per_source_bin: 2

  include_target_solution: false

# Condition label: stamped on every CSV row, the JSON run_metadata, the output
# filenames, and the run registry so runs are traceable without the folder path.
experiment_label: "trim_all"

prompts_dir: "prompt_variants/trim_all"
expert_profiles_file: "../../../inter_benchmark_calibration/input_data/expert_profiles/expert_profiles.yaml"
output_dir: "results/trim_all"

llm_settings:
  model: "claude-sonnet-4-6"
  temperature: 1.0
  max_concurrent_calls: 10
  rate_limit_calls: 200
  rate_limit_period: 60
  reasoning_effort: "off"   # no extended thinking (matches the no-thinking cost basis)

workflow_settings:
  num_experts: 1
  delphi_rounds: 1
  convergence_threshold: 0.05
  # 1 run = 300 cells; run-to-run noise is negligible (SD~0.0013).
  num_repeats: 1
  skip_analysis: true        # no stage-1 analysis call (part of "trim all")

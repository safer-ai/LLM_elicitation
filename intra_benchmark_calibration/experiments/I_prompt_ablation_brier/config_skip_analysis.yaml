# =============================================================================
# Experiment I — prompt ablation (Brier), condition: SKIP_ANALYSIS  (Level 1)
# Forecaster model: claude-sonnet-4-6, reasoning_effort=off (no thinking)
#
# Leave-one-out: removes EXACTLY the stage-1 capability-analysis API call,
# nothing else. The estimation prompt is byte-identical to control except the
# now-empty <your_prior_analysis> block is dropped (no analysis is produced).
# The reasoning checklist AND the {ground_truth_summary} footnote are KEPT —
# this isolates the marginal value of the separate analysis call alone.
#
# Single call per cell (estimation only), like minimal — but unlike minimal it
# keeps the full reasoning scaffold + footnote.
#
# Cell count:  5 target bins × 12 forecasted models × 5 tasks = 300 cells
# API calls:   300 × 1 (estimation only) × 1 repeat              = 300
# =============================================================================

intra_benchmark_settings:
  lyptus_repo_dir: ~/lyptus-data
  drop_models: ["GPT-2", "GPT-3", "GPT-3.5"]
  forecasted_models: null   # null → all 12 models post-drop

  binning:
    n_bins: 5
    strategy: equal_count

  target_selection:
    selection_mode: "auto"
    n_target_tasks_per_cell: 5

  source_profile:
    source_bins_to_show: "all_except_target"
    n_examples_per_source_bin: 2

  include_target_solution: false

# Condition label: stamped on every CSV row, the JSON run_metadata, the output
# filenames, and the run registry so runs are traceable without the folder path.
experiment_label: "skip_analysis"

prompts_dir: "prompt_variants/skip_analysis"
expert_profiles_file: "../../../inter_benchmark_calibration/input_data/expert_profiles/expert_profiles.yaml"
output_dir: "results/skip_analysis"

llm_settings:
  model: "claude-sonnet-4-6"
  temperature: 1.0
  max_concurrent_calls: 10
  rate_limit_calls: 200
  rate_limit_period: 60
  reasoning_effort: "off"   # no extended thinking (matches the no-thinking cost basis)

workflow_settings:
  num_experts: 1
  delphi_rounds: 1
  convergence_threshold: 0.05
  # 1 run = 300 cells; run-to-run noise is negligible (SD~0.0013), uncertainty
  # comes from task sampling (bootstrap over the 300 cells).
  num_repeats: 1
  skip_analysis: true        # removes the stage-1 analysis call (the LOO variable)
